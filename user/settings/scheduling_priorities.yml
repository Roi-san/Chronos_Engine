# Scheduling Priorities
# =====================
# This file should only contain factors that still make sense as weighted
# priorities in Kairos v2.
#
# These are not hard constraints or structural rules.
# They are the remaining ranked influences among already-valid options.

Scheduling_Priorities:
  - Name: Category
    Order: 1
    Rank: 6
    Description: Life-domain importance from Category_Settings.
  - Name: Happiness
    Order: 2
    Rank: 4
    Description: Alignment with the Map of Happiness.
  - Name: Due Date
    Order: 3
    Rank: 4
    Description: Rising urgency as a completion boundary approaches.
  - Name: Deadline
    Order: 4
    Rank: 5
    Description: Rising urgency as a harder completion boundary approaches.
  - Name: Priority Property
    Order: 5
    Rank: 4
    Description: The item's explicit authored priority.
  - Name: Goal Alignment
    Order: 6
    Rank: 5
    Description: Work linked to an active goal or milestone. Grows with the goal's priority and as its date approaches. 5 is neutral, 10 doubles the push, 0 switches it off.
  - Name: Commitment Pressure
    Order: 7
    Rank: 5
    Description: Work an unmet commitment counts. Grows as the period runs out, peaks on the last possible day, and carries over after a missed period. 5 is neutral, 10 doubles the push, 0 switches it off.
  - Name: Recurring Pressure
    Order: 8
    Rank: 5
    Description: Weekly, monthly, quarterly and yearly habits and chores once their turn has come, and daily ones missed yesterday. Grows as the period runs out (docs/scheduling/recurrence_design.md). 5 is neutral, 10 doubles the push, 0 switches it off (the items are still planned on their turn).
